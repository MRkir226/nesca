name: Build Nesca Windows

on:
  workflow_dispatch:
  push:
    branches: [ master ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-qt5-base
            mingw-w64-ucrt-x86_64-qt5-multimedia
            mingw-w64-ucrt-x86_64-libssh
            mingw-w64-ucrt-x86_64-openssl
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-make

      - name: Build project
        shell: msys2 {0}
        run: |
          /ucrt64/bin/qmake-qt5 nesca_3.pro "INCLUDEPATH += /ucrt64/include" "LIBS += -L/ucrt64/lib -lssh -lssl -lcrypto"
          mingw32-make -j4

      - name: Package release
        shell: msys2 {0}
        run: |
          mkdir dist
          cp release/nesca_3.exe dist/
          /ucrt64/bin/windeployqt-qt5 dist/nesca_3.exe
          cp /ucrt64/bin/libssh.dll /ucrt64/bin/libssl-*.dll /ucrt64/bin/libcrypto-*.dll dist/
          cp *.txt *.ttf HCNetSDK.dll dist/ 2>/dev/null || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nesca-windows
          path: dist/
