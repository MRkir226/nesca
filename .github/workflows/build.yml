name: Build Nesca Windows

on:
  workflow_dispatch:
  push:
    branches: [ master ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-qt5-base
            mingw-w64-ucrt-x86_64-qt5-multimedia
            mingw-w64-ucrt-x86_64-qt5-declarative
            mingw-w64-ucrt-x86_64-libssh
            mingw-w64-ucrt-x86_64-openssl
            mingw-w64-ucrt-x86_64-curl
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-make

      - name: Build project
        shell: msys2 {0}
        run: |
          cat << 'EOF' > nesca_3.pro
          TEMPLATE = app
          TARGET = nesca_3
          QT += core gui widgets multimedia multimediawidgets network qml
          CONFIG += release c++11
          QMAKE_CXXFLAGS += -fpermissive -Wno-error
          INCLUDEPATH += . /ucrt64/include
          LIBS += -L. -L/ucrt64/lib -lssh -lssl -lcrypto -lcurl -lws2_32 -lwsock32
          exists(HCNetSDK.lib): LIBS += -lHCNetSDK
          SOURCES += $$files(*.cpp)
          HEADERS += $$files(*.h)
          FORMS += $$files(*.ui)
          RESOURCES += $$files(*.qrc)
          EOF
          /ucrt64/bin/qmake-qt5 nesca_3.pro
          mingw32-make -j4

      - name: Package release
        shell: msys2 {0}
        run: |
          mkdir -p dist
          cp release/nesca_3.exe dist/
          /ucrt64/bin/windeployqt-qt5 dist/nesca_3.exe
          cp /ucrt64/bin/libssh.dll /ucrt64/bin/libssl-*.dll /ucrt64/bin/libcrypto-*.dll /ucrt64/bin/libcurl-*.dll /ucrt64/bin/zlib1.dll /ucrt64/bin/libgcc_s_seh-1.dll /ucrt64/bin/libstdc++-6.dll /ucrt64/bin/libwinpthread-1.dll dist/ 2>/dev/null || true
          cp *.txt *.ttf *.dll *.ini *.cfg dist/ 2>/dev/null || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nesca-windows
          path: dist/
