name: Build Nesca Windows

on:
  workflow_dispatch:
  push:
    branches: [ master ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-qt5
            mingw-w64-x86_64-libssh
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-toolchain

      - name: Build project
        shell: msys2 {0}
        run: |
          qmake nesca_3.pro "INCLUDEPATH += /mingw64/include" "LIBS += -L/mingw64/lib -lssh -lssl -lcrypto"
          mingw32-make -j4

      - name: Package release
        shell: msys2 {0}
        run: |
          mkdir dist
          cp release/nesca_3.exe dist/
          windeployqt dist/nesca_3.exe
          cp /mingw64/bin/libssh.dll /mingw64/bin/libssl-*.dll /mingw64/bin/libcrypto-*.dll dist/
          cp *.txt *.ttf HCNetSDK.dll dist/ 2>/dev/null || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nesca-windows
          path: dist/
